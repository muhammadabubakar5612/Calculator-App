<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="name">
                <i >abubakar'sCalculator</i>
            </div>
        </nav>
        <div class="screen">
            <h2 class="solution">0</h2>
        </div>
        <div class="btns">
            <div class="row1">
                <button class="btn btn9" class="btn9">9</button>
                <button class="btn btn8" >8</button>
                <button class="btn btn7">7</button>
                 <button class="btn btn10">/</button>
            </div>
            
               <div class="row2">
                <button class="btn btn6">6</button>
                <button class="btn btn5">5</button>
                <button class="btn btn4" >4</button>
                 <button class="btn btn11">X</button>
            </div>

                <div class="row3">
                <button class="btn btn3">3</button>
                <button class="btn btn2">2</button>
                <button class="btn btn1">1</button>
                 <button class="btn btn12">+</button>
            </div>

                <div class="row4">
                <button class="btn btn0">0</button>
                <button class="btn btn13">back</button>
                <button class="btn btn14">=</button>
                 <button class="btn btn15">-</button>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
